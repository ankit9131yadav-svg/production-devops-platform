apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: production-app-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ankit9131yadav-svg/Production_app.git
    targetRevision: main
    path: helm/production-app
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: production-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
