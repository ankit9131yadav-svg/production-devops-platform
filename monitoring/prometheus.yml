global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - "MONITORING_SERVER_IP

rule_files:
  - "alert_rules.yml"

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets:
          - localhost:9090

  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "1KUBERNETES_NODE_IP"
